<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f959b"/>
    </marker>
  </defs>
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#24292f">Theme tokens: one block per theme, variables only</text>

  <!-- defaults -->
  <rect x="30" y="60" width="290" height="200" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="175" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">page  (defaults)</text>
  <text x="50" y="112" font-size="11" fill="#57606a" font-family="Consolas, monospace">--primary: #6D4AE0;</text>
  <text x="50" y="132" font-size="11" fill="#57606a" font-family="Consolas, monospace">--text: #22303C;</text>
  <text x="50" y="152" font-size="11" fill="#57606a" font-family="Consolas, monospace">--panel: #FFFFFF;</text>
  <text x="50" y="172" font-size="11" fill="#57606a" font-family="Consolas, monospace">--code-bg: #F2ECFD;</text>
  <text x="50" y="192" font-size="11" fill="#57606a" font-family="Consolas, monospace">--warn-bg: #FDF2EC;</text>
  <text x="50" y="212" font-size="11" fill="#57606a" font-family="Consolas, monospace">--veil: transparent;</text>
  <text x="175" y="242" text-anchor="middle" font-size="10.5" fill="#8f959b">semantic tokens, consumed via var(--*)</text>

  <!-- theme blocks -->
  <rect x="390" y="60" width="290" height="60" rx="10" fill="#e8f5ee" stroke="#2e8f6e" stroke-width="1.5"/>
  <text x="535" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6e53">.theme-aurora</text>
  <text x="535" y="104" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="Consolas, monospace">--primary: #3BC492; --bg-img: aurora.jpg; --veil: …</text>

  <rect x="390" y="132" width="290" height="60" rx="10" fill="#fff3d9" stroke="#c99327" stroke-width="1.5"/>
  <text x="535" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#a1741a">.theme-ginkgo</text>
  <text x="535" y="176" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="Consolas, monospace">--primary: #C99107; --bg-img: ginkgo.jpg; --veil: …</text>

  <rect x="390" y="204" width="290" height="60" rx="10" fill="#f4f0ff" stroke="#6d4ae0" stroke-width="1.5"/>
  <text x="535" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#5533c9">.theme-violet (default)</text>
  <text x="535" y="248" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="Consolas, monospace">--primary: #6D4AE0; pure CSS, no image</text>

  <line x1="320" y1="160" x2="386" y2="160" stroke="#8f959b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="353" y="150" text-anchor="middle" font-size="10" fill="#8f959b">overrides</text>

  <!-- components -->
  <rect x="750" y="60" width="200" height="200" rx="10" fill="#eef2fa" stroke="#3c6e9e" stroke-width="1.5"/>
  <text x="850" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5a82">UI components</text>
  <text x="770" y="112" font-size="11" fill="#57606a" font-family="Consolas, monospace">color: var(--text)</text>
  <text x="770" y="132" font-size="11" fill="#57606a" font-family="Consolas, monospace">background: var(--panel)</text>
  <text x="770" y="152" font-size="11" fill="#57606a" font-family="Consolas, monospace">border: var(--line)</text>
  <text x="770" y="172" font-size="11" fill="#57606a" font-family="Consolas, monospace">code: var(--code-bg)</text>
  <text x="850" y="242" text-anchor="middle" font-size="10.5" fill="#8f959b">zero page-code changes per theme</text>

  <line x1="680" y1="160" x2="746" y2="160" stroke="#8f959b" stroke-width="1.5" marker-end="url(#arr2)"/>
</svg>
